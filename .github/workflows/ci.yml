name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Bootstrap pinned example tools
        run: make bootstrap
      - name: Filter and offline examples
        run: make check-examples
      - name: Install and exercise the installed filter
        run: |
          make install DESTDIR="$RUNNER_TEMP/install" PREFIX=/usr/local
          python3 tests/smoke "$RUNNER_TEMP/install/usr/local/bin/weave"
      - name: Man page
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mandoc
          mandoc -Tlint weave.1

  package:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: make release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weave-release-candidate
          path: dist/
          if-no-files-found: error
