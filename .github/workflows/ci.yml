name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ply runs commands the way a Unix shell does and depends on that: its own
  # process group so a timeout kills what a script started, /dev/null on
  # stdin so nothing waits for a typist. Both platforms it claims to run on
  # are tested on every push.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # The runner writes a command's output from two pipes into one buffer
      # while the loop reads it. A race there would be invisible in ordinary
      # runs and corrupting in real ones.
      - name: test -race
        run: go test -race ./...

      - name: build
        run: go build ./...

      # The docs tests hold the man page against the code; mandoc holds it
      # against the format. Neither substitutes for the other.
      - name: man page lint
        if: runner.os == 'Linux'
        run: sudo apt-get install -y mandoc && mandoc -Tlint ply.1

  # The docs tests already prove the man page and help agree with the code.
  # This proves the thing they cannot: that the module is installable the
  # way the README says it is.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go install .
      - run: ply version
