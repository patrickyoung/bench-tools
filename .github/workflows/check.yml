name: Independent tools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.matrix.outputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, matches imported Weave CI
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tools/ask/go.mod
          cache: false
      - run: python3 scripts/check-boundaries.py
      - run: python3 scripts/check-docs.py
      - run: python3 scripts/workers check
      - run: python3 -m unittest discover -s scripts/tests -v
      - id: matrix
        run: echo "components=$(python3 scripts/check --list)" >> "$GITHUB_OUTPUT"

  standalone:
    needs: boundaries
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        component: ${{ fromJSON(needs.boundaries.outputs.components) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tools/ask/go.mod
          cache: false
      - name: Check isolated source with no sibling checkout
        run: python3 scripts/check --component '${{ matrix.component }}'
      - name: Preserve complete verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: standalone-${{ matrix.os }}-${{ matrix.component }}
          path: .checks/
          include-hidden-files: true
          if-no-files-found: warn

  integration:
    needs: boundaries
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tools/ask/go.mod
          cache: false
      - name: Compose independently built public commands with local fixtures
        run: python3 scripts/check --integration-only
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-${{ matrix.os }}
          path: .checks/
          include-hidden-files: true
          if-no-files-found: warn

  native-cage:
    needs: boundaries
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tools/cage/go.mod
          cache: false
      - name: Install the documented Linux backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor
          # Ubuntu restricts unprivileged user namespaces unless the executable
          # has an AppArmor grant. Scope that grant to the trusted system bwrap
          # on this disposable runner; retain the host's global restriction.
          # https://documentation.ubuntu.com/release-notes/24.04/
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo tee /etc/apparmor.d/bench-tools-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bench-tools-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/bench-tools-bwrap
          fi
      - name: Prove native confinement, failing if the host cannot supply it
        run: python3 scripts/check --component cage --native-cage
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-cage-${{ matrix.os }}
          path: .checks/
          include-hidden-files: true
          if-no-files-found: warn

  build-install:
    needs: boundaries
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tools/ask/go.mod
          cache: false
      - name: Build all independent packages
        run: make build
      - name: Verify installation, relocation, assets, update and uninstall
        run: python3 scripts/check-install.py
      - name: Run starter examples with local model fixtures
        run: python3 scripts/check-examples.py --bin-dir .build/bin

  worker-browser:
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Export exactly the checked commit, without examples or run content
        run: python3 scripts/workers export-team page-team "$RUNNER_TEMP/page-team" --ref "$(git rev-parse HEAD)" --allow-experimental
      - name: Install pinned browser dependency in the disposable export
        working-directory: ${{ runner.temp }}/page-team/expert
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Exercise the assembled team's browser acceptance boundary
        run: node teams/page-team/tests/browser.mjs "$RUNNER_TEMP/page-team/expert"
      - name: Export the independent Visual artist definition
        run: python3 scripts/workers export visual-artist "$RUNNER_TEMP/visual-artist" --ref "$(git rev-parse HEAD)" --allow-experimental
      - name: Check Visual artist contracts against synthetic counterexamples
        env:
          VISUAL_ARTIST_EXPERT: ${{ runner.temp }}/visual-artist/expert
        run: python3 -m unittest discover -s workers/visual-artist/tests -v
