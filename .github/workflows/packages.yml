name: Builder packages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/packages.yml'
      - 'scripts/package-runtime'
      - 'scripts/prebuilt_support.py'
      - 'scripts/setup'
      - 'releases/builder.json'

permissions:
  contents: read

jobs:
  package:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: darwin-amd64
          - os: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tools/ask/go.mod
          cache: false
      - name: Install the documented Linux confinement backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo tee /etc/apparmor.d/bench-tools-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bench-tools-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/bench-tools-bwrap
          fi
      - name: Build independent packages from the selected source
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            python3 scripts/build --no-cgo
          else
            python3 scripts/build
          fi
      - name: Package native commands with their original receipts
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          python3 scripts/package-runtime --from-build .build --output "$RUNNER_TEMP/packages/bench-builder-$TARGET_PLATFORM.tar.gz"
      - name: Extract, verify and install the distributed bytes
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from prebuilt_support import digest, extract, host_platform, verify_extracted
          root = Path(os.environ['RUNNER_TEMP'])
          archive = root / 'packages' / ('bench-builder-' + os.environ['TARGET_PLATFORM'] + '.tar.gz')
          metadata = json.loads(Path(str(archive) + '.json').read_text())
          assert metadata['platform'] == host_platform() == os.environ['TARGET_PLATFORM']
          assert metadata['revision'] == os.environ['GITHUB_SHA']
          assert metadata['sha256'] == digest(archive) and metadata['size'] == archive.stat().st_size
          extract(archive, root / 'unpacked', metadata['tools'])
          verify_extracted(root / 'unpacked', metadata, metadata['tools'])
          PY
          python3 scripts/check-install.py --build-dir "$RUNNER_TEMP/unpacked"
          python3 scripts/setup --from-build "$RUNNER_TEMP/unpacked" --prefix "$RUNNER_TEMP/runtime" --state-dir "$RUNNER_TEMP/setup"
      - name: Verify the published full release without a compiler
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json, os, shlex, subprocess, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from prebuilt_support import select_artifact
          root = Path.cwd()
          components = json.loads((root / 'components.json').read_text())['components']
          tools = [component['name'] for component in components]
          artifact = select_artifact(root, tools)
          if artifact is None:
              print('No matching complete published release yet; skipping published-release proof.', flush=True)
              raise SystemExit(0)
          with tempfile.TemporaryDirectory(prefix='bench-published-release-', dir=os.environ['RUNNER_TEMP']) as temporary:
              work = Path(temporary)
              guard, prefix, marker = work / 'compiler-guard', work / 'runtime', work / 'compiler-invoked'
              guard.mkdir()
              compiler = guard / 'go'
              compiler.write_text('#!/bin/sh\n: > ' + shlex.quote(str(marker)) +
                                  '\necho "Published release unexpectedly invoked Go" >&2\nexit 97\n')
              compiler.chmod(0o755)
              env = dict(os.environ, PATH=str(guard) + os.pathsep + os.environ['PATH'])
              subprocess.run([sys.executable, root / 'scripts/install', '--from-release', '--prefix', prefix],
                             env=env, check=True)
              commands = [command['name'] for component in components for command in component['commands']]
              if {path.name for path in (prefix / 'bin').iterdir()} != set(commands):
                  raise RuntimeError('published release installed an incomplete command inventory')
              env['PATH'] = str(prefix / 'bin') + os.pathsep + env['PATH']
              for command in commands:
                  for option in ('version', 'help'):
                      result = subprocess.run([prefix / 'bin' / command, option], env=env, check=True,
                                              capture_output=True, text=True, timeout=30)
                      if not (result.stdout or result.stderr).strip():
                          raise RuntimeError('empty ' + option + ' output from ' + command)
              if marker.exists():
                  raise RuntimeError('published release verification invoked Go')
              print('Published release check passed: ' + str(len(commands)) + ' commands installed from ' +
                    artifact['url'] + ' without invoking Go.', flush=True)
          PY
      - name: Attest the checked archive
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: '${{ runner.temp }}/packages/bench-builder-${{ matrix.platform }}.tar.gz'
          create-storage-record: false
      - name: Retain and verify signed build provenance
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/packages/bench-builder-$TARGET_PLATFORM.tar.gz"
          cp "$ATTESTATION_BUNDLE" "$archive.sigstore.json"
          gh attestation verify "$archive" \
            --bundle "$archive.sigstore.json" \
            --repo patrickyoung/bench-tools \
            --cert-identity "https://github.com/patrickyoung/bench-tools/.github/workflows/packages.yml@$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --signer-digest "$GITHUB_SHA" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --deny-self-hosted-runners
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: builder-${{ matrix.platform }}
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
